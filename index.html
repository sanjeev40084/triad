<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Triad — Focus & Task Manager</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#0F1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Triad">
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Triad%22%2C%22short_name%22%3A%22Triad%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230F1117%22%2C%22theme_color%22%3A%22%230F1117%22%2C%22icons%22%3A%5B%5D%7D">

    <!-- Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <!-- React 18 & ReactDOM & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0F1117;
            color: #F8FAFC;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .touch-dragging {
            touch-action: none !important;
            user-select: none;
            -webkit-user-select: none;
        }
        /* Custom smooth scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-[#0F1117] text-slate-100 antialiased min-h-screen selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const STORAGE_KEY = 'triad_tasks_v2';
        const GIST_TOKEN_KEY = 'triad_gist_token_v2';
        const GIST_ID_KEY = 'triad_gist_id_v2';

        const INITIAL_TASKS = [
            { id: '1', title: 'Review quarterly DevOps infrastructure deployment pipeline', category: 'work', status: 'focus', order: 0, updatedAt: Date.now() - 3600000 },
            { id: '2', title: 'Finalize Dataverse custom AI prompt builder templates', category: 'work', status: 'focus', order: 1, updatedAt: Date.now() - 3500000 },
            { id: '3', title: 'Organize garage storage and test lawn watering system zones', category: 'personal', status: 'focus', order: 2, updatedAt: Date.now() - 3400000 },
            { id: '4', title: 'Prepare team code documentation and PAC CLI standard operating procedures', category: 'work', status: 'queue', order: 0, updatedAt: Date.now() - 3300000 },
            { id: '5', title: 'Schedule indoor houseplant repotting session for rubber plant and ZZ plant', category: 'personal', status: 'queue', order: 1, updatedAt: Date.now() - 3200000 },
            { id: '6', title: 'Update GitHub repository secrets and Azure managed identity certificates', category: 'work', status: 'queue', order: 2, updatedAt: Date.now() - 3100000 },
        ];

        function App() {
            const [tasks, setTasks] = useState(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try { return JSON.parse(saved); } catch (e) { console.error(e); }
                }
                return INITIAL_TASKS;
            });
            const [deletedIds, setDeletedIds] = useState(() => {
                const saved = localStorage.getItem('triad_deleted_ids');
                return saved ? JSON.parse(saved) : [];
            });

            const [filter, setFilter] = useState('all'); // 'all', 'work', 'personal'
            const [isAddOpen, setIsAddOpen] = useState(false);
            const [newTitle, setNewTitle] = useState('');
            const [newCategory, setNewCategory] = useState('work');
            const [isQuickFocus, setIsQuickFocus] = useState(false);
            const [toast, setToast] = useState(null);

            // Sync state
            const [isSyncModalOpen, setIsSyncModalOpen] = useState(false);
            const [gistToken, setGistToken] = useState(() => localStorage.getItem(GIST_TOKEN_KEY) || '');
            const [gistId, setGistId] = useState(() => localStorage.getItem(GIST_ID_KEY) || '');
            const [isSyncing, setIsSyncing] = useState(false);
            const [syncStatus, setSyncStatus] = useState('idle');

            // Completed Drawer
            const [isCompletedOpen, setIsCompletedOpen] = useState(false);

            // Inline Edit State
            const [editingId, setEditingId] = useState(null);
            const [editText, setEditText] = useState('');

            // Drag state ref
            const dragMetaRef = useRef(null);
            const [, setForceRender] = useState(0);

            // Save tasks & deleted IDs to localStorage
            useEffect(() => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
                localStorage.setItem('triad_deleted_ids', JSON.stringify(deletedIds));
            }, [tasks, deletedIds]);

            // Save Gist credentials persistently
            useEffect(() => {
                localStorage.setItem(GIST_TOKEN_KEY, gistToken);
                localStorage.setItem(GIST_ID_KEY, gistId);
            }, [gistToken, gistId]);

            const triggerToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 3000);
            };

            const focusCount = tasks.filter(t => t.status === 'focus').length;

            // Auto push/pull sync if configured
            const autoSyncWithGist = async (updatedTasks, updatedDeleted) => {
                if (!gistToken || !gistId) return;
                try {
                    const res = await fetch(`https://api.github.com/gists/${gistId}`, {
                        headers: { 'Authorization': `token ${gistToken}` }
                    });
                    if (!res.ok) return;
                    const data = await res.json();
                    const filename = 'triad-tasks-v2.json';
                    if (data.files && data.files[filename]) {
                        const remoteContent = JSON.parse(data.files[filename].content);
                        const remoteTasks = remoteContent.tasks || [];
                        const remoteDeleted = remoteContent.deletedIds || [];

                        const mergedMap = new Map();
                        const allTasksMap = [...tasks, ...updatedTasks, ...remoteTasks];

                        allTasksMap.forEach(t => {
                            if (updatedDeleted.includes(t.id) || remoteDeleted.includes(t.id)) return;
                            const existing = mergedMap.get(t.id);
                            if (!existing || (t.updatedAt || 0) > (existing.updatedAt || 0)) {
                                mergedMap.set(t.id, t);
                            }
                        });

                        const finalTasks = Array.from(mergedMap.values());
                        const finalDeleted = Array.from(new Set([...deletedIds, ...updatedDeleted, ...remoteDeleted]));
                        
                        setTasks(finalTasks);
                        setDeletedIds(finalDeleted);

                        await fetch(`https://api.github.com/gists/${gistId}`, {
                            method: 'PATCH',
                            headers: {
                                'Authorization': `token ${gistToken}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                files: {
                                    [filename]: {
                                        content: JSON.stringify({ tasks: finalTasks, deletedIds: finalDeleted }, null, 2)
                                    }
                                }
                            })
                        });
                    }
                } catch (err) {
                    console.error('Auto sync error:', err);
                }
            };

            const handleManualSync = async (pushOnly = false) => {
                if (!gistToken || !gistId) {
                    triggerToast('Please enter Gist ID & Token first!');
                    setIsSyncModalOpen(true);
                    return;
                }
                setIsSyncing(true);
                try {
                    const filename = 'triad-tasks-v2.json';
                    if (!pushOnly) {
                        const res = await fetch(`https://api.github.com/gists/${gistId}`, {
                            headers: { 'Authorization': `token ${gistToken}` }
                        });
                        if (!res.ok) throw new Error('Failed to fetch Gist');
                        const data = await res.json();
                        if (data.files && data.files[filename]) {
                            const remoteContent = JSON.parse(data.files[filename].content);
                            const remoteTasks = remoteContent.tasks || [];
                            const remoteDeleted = remoteContent.deletedIds || [];

                            const mergedMap = new Map();
                            [...tasks, ...remoteTasks].forEach(t => {
                                if (deletedIds.includes(t.id) || remoteDeleted.includes(t.id)) return;
                                const existing = mergedMap.get(t.id);
                                if (!existing || (t.updatedAt || 0) > (existing.updatedAt || 0)) {
                                    mergedMap.set(t.id, t);
                                }
                            });
                            const finalTasks = Array.from(mergedMap.values());
                            const finalDeleted = Array.from(new Set([...deletedIds, ...remoteDeleted]));
                            setTasks(finalTasks);
                            setDeletedIds(finalDeleted);
                        }
                    }

                    const pushRes = await fetch(`https://api.github.com/gists/${gistId}`, {
                        method: 'PATCH',
                        headers: {
                            'Authorization': `token ${gistToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            files: {
                                [filename]: {
                                    content: JSON.stringify({ tasks, deletedIds }, null, 2)
                                }
                            }
                        })
                    });
                    if (!pushRes.ok) throw new Error('Failed to update Gist');
                    setSyncStatus('success');
                    triggerToast('Cloud sync successful!');
                    setTimeout(() => setSyncStatus('idle'), 3000);
                } catch (err) {
                    console.error(err);
                    setSyncStatus('error');
                    triggerToast('Sync failed. Check credentials.');
                } finally {
                    setIsSyncing(false);
                }
            };

            // Task Actions
            const addTask = (e) => {
                e.preventDefault();
                if (!newTitle.trim()) return;

                const focusList = tasks.filter(t => t.status === 'focus');
                let targetStatus = newCategory === 'focus' ? 'focus' : 'queue';
                
                if (isQuickFocus && focusCount < 3) {
                    targetStatus = 'focus';
                } else if (targetStatus === 'focus' && focusCount >= 3) {
                    targetStatus = 'queue';
                    triggerToast('Focus slots full (3/3). Added to Up Next.');
                }

                const sameStatusCount = tasks.filter(t => t.status === targetStatus).length;
                const newTask = {
                    id: Date.now().toString(),
                    title: newTitle.trim(),
                    category: newCategory === 'focus' ? 'work' : newCategory,
                    status: targetStatus,
                    order: sameStatusCount,
                    updatedAt: Date.now()
                };

                const updated = [...tasks, newTask];
                setTasks(updated);
                setNewTitle('');
                setIsQuickFocus(false);
                setIsAddOpen(false);
                triggerToast('Task added successfully');
                autoSyncWithGist(updated, deletedIds);
            };

            const toggleComplete = (id) => {
                const target = tasks.find(t => t.id === id);
                if (!target) return;
                const newStatus = target.status === 'completed' ? 'queue' : 'completed';
                const updated = tasks.map(t => t.id === id ? { ...t, status: newStatus, updatedAt: Date.now() } : t);
                setTasks(updated);
                autoSyncWithGist(updated, deletedIds);
                if (newStatus === 'completed') triggerToast('Task completed! 🎉');
            };

            const moveToFocus = (id) => {
                if (focusCount >= 3) {
                    triggerToast('Focus slots are full (3/3)!');
                    return;
                }
                const focusItems = tasks.filter(t => t.status === 'focus');
                const updated = tasks.map(t => {
                    if (t.id === id) {
                        return { ...t, status: 'focus', order: focusItems.length, updatedAt: Date.now() };
                    }
                    return t;
                });
                setTasks(updated);
                autoSyncWithGist(updated, deletedIds);
                triggerToast('Moved to Focus Now');
            };

            const moveToQueue = (id) => {
                const queueItems = tasks.filter(t => t.status === 'queue');
                const updated = tasks.map(t => {
                    if (t.id === id) {
                        return { ...t, status: 'queue', order: queueItems.length, updatedAt: Date.now() };
                    }
                    return t;
                });
                setTasks(updated);
                autoSyncWithGist(updated, deletedIds);
                triggerToast('Returned to Up Next');
            };

            const moveToWaiting = (id) => {
                const waitingItems = tasks.filter(t => t.status === 'waiting');
                const updated = tasks.map(t => {
                    if (t.id === id) {
                        return { ...t, status: 'waiting', order: waitingItems.length, updatedAt: Date.now() };
                    }
                    return t;
                });
                setTasks(updated);
                autoSyncWithGist(updated, deletedIds);
                triggerToast('Parked in Waiting Shelf');
            };

            const deleteTask = (id) => {
                const updated = tasks.filter(t => t.id !== id);
                const newDeleted = [...deletedIds, id];
                setTasks(updated);
                setDeletedIds(newDeleted);
                autoSyncWithGist(updated, newDeleted);
                triggerToast('Task deleted');
            };

            const saveInlineEdit = (id) => {
                if (!editText.trim()) {
                    setEditingId(null);
                    return;
                }
                const updated = tasks.map(t => t.id === id ? { ...t, title: editText.trim(), updatedAt: Date.now() } : t);
                setTasks(updated);
                setEditingId(null);
                autoSyncWithGist(updated, deletedIds);
                triggerToast('Task updated');
            };

            // Global Pointer Events for Robust Drag and Drop
            const handlePointerDown = (e, item, statusList) => {
                if (e.button !== undefined && e.button !== 0) return; // Only left click / touch
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const cardEl = e.currentTarget.closest('[data-id]');
                const rect = cardEl ? cardEl.getBoundingClientRect() : { top: 0, height: 60 };
                
                dragMetaRef.current = {
                    id: item.id,
                    status: item.status,
                    startY: clientY,
                    offsetY: 0,
                    initialTop: rect.top,
                    height: rect.height,
                    list: statusList
                };

                window.addEventListener('pointermove', handlePointerMove);
                window.addEventListener('pointerup', handlePointerUp);
                window.addEventListener('touchmove', handleTouchMove, { passive: false });
                window.addEventListener('touchend', handlePointerUp);

                setForceRender(n => n + 1);
            };

            const handleTouchMove = (e) => {
                if (dragMetaRef.current) {
                    e.preventDefault(); // Stop mobile browser scrolling while dragging
                }
            };

            const handlePointerMove = (e) => {
                const meta = dragMetaRef.current;
                if (!meta) return;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const deltaY = clientY - meta.startY;
                meta.offsetY = deltaY;

                // Check for item swap based on midpoint threshold
                const siblings = tasks.filter(t => t.status === meta.status).sort((a,b) => a.order - b.order);
                const currentIndex = siblings.findIndex(t => t.id === meta.id);

                if (currentIndex > 0 && deltaY < -meta.height * 0.45) {
                    const prev = siblings[currentIndex - 1];
                    reorderItems(meta.id, prev.id, meta.status);
                    meta.startY = clientY;
                    meta.initialTop -= meta.height;
                    meta.offsetY = 0;
                } else if (currentIndex < siblings.length - 1 && deltaY > meta.height * 0.45) {
                    const next = siblings[currentIndex + 1];
                    reorderItems(meta.id, next.id, meta.status);
                    meta.startY = clientY;
                    meta.initialTop += meta.height;
                    meta.offsetY = 0;
                }
                setForceRender(n => n + 1);
            };

            const handlePointerUp = () => {
                if (!dragMetaRef.current) return;
                dragMetaRef.current = null;

                window.removeEventListener('pointermove', handlePointerMove);
                window.removeEventListener('pointerup', handlePointerUp);
                window.removeEventListener('touchmove', handleTouchMove);
                window.removeEventListener('touchend', handlePointerUp);

                setForceRender(n => n + 1);
            };

            const reorderItems = (draggedId, targetId, status) => {
                const list = tasks.filter(t => t.status === status).sort((a,b) => a.order - b.order);
                const draggedIdx = list.findIndex(t => t.id === draggedId);
                const targetIdx = list.findIndex(t => t.id === targetId);
                if (draggedIdx === -1 || targetIdx === -1) return;

                const [removed] = list.splice(draggedIdx, 1);
                list.splice(targetIdx, 0, removed);

                const reorderedMap = new Map(list.map((t, idx) => [t.id, idx]));
                const updated = tasks.map(t => {
                    if (t.status === status && reorderedMap.has(t.id)) {
                        return { ...t, order: reorderedMap.get(t.id), updatedAt: Date.now() };
                    }
                    return t;
                });
                setTasks(updated);
                autoSyncWithGist(updated, deletedIds);
            };

            const matchesFilter = (t) => {
                if (filter === 'all') return true;
                return t.category === filter;
            };

            const focusTasks = tasks.filter(t => t.status === 'focus' && matchesFilter(t)).sort((a,b) => a.order - b.order);
            const queueTasks = tasks.filter(t => t.status === 'queue' && matchesFilter(t)).sort((a,b) => a.order - b.order);
            const waitingTasks = tasks.filter(t => t.status === 'waiting' && matchesFilter(t)).sort((a,b) => a.order - b.order);
            const completedTasks = tasks.filter(t => t.status === 'completed' && matchesFilter(t)).sort((a,b) => b.updatedAt - a.updatedAt);

            return (
                <div className="min-h-screen bg-[#0F1117] text-slate-100 flex flex-col items-center">
                    
                    {/* Toast Notification */}
                    {toast && (
                        <div className="fixed top-5 z-50 bg-slate-800 text-slate-100 px-4 py-2.5 rounded-2xl shadow-2xl border border-slate-700/80 text-sm font-medium flex items-center space-x-2 animate-bounce">
                            <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                            <span>{toast}</span>
                        </div>
                    )}

                    <div className="w-full max-w-5xl mx-auto flex flex-col min-h-screen md:py-8 md:px-4">
                        
                        {/* Header */}
                        <header className="px-5 pt-6 pb-4 flex items-center justify-between border-b border-slate-800/60 bg-[#0F1117]/80 backdrop-blur-md sticky top-0 z-30">
                            <div>
                                <div className="text-xs uppercase tracking-wider text-slate-400 font-semibold mb-0.5">
                                    {new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}
                                </div>
                                <h1 className="text-2xl font-extrabold tracking-tight text-white flex items-center space-x-2">
                                    <span>Triad</span>
                                </h1>
                            </div>

                            <div className="flex items-center space-x-3">
                                <button 
                                    onClick={() => setIsSyncModalOpen(true)}
                                    className={`px-3 py-1.5 rounded-full text-xs font-semibold flex items-center space-x-1.5 transition border ${
                                        gistToken && gistId 
                                            ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30 hover:bg-emerald-500/20' 
                                            : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'
                                    }`}
                                >
                                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                                    <span>{gistToken && gistId ? 'Synced' : 'Cloud Sync'}</span>
                                </button>

                                <div className="flex items-center space-x-2 bg-slate-900/90 border border-slate-800 px-3 py-1.5 rounded-full shadow-inner">
                                    <svg className="w-5 h-5 -rotate-90" viewBox="0 0 36 36">
                                        <path className="text-slate-800" strokeWidth="3.5" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                                        <path className={focusCount >= 3 ? "text-amber-500 transition-all duration-500" : "text-indigo-500 transition-all duration-500"} 
                                            strokeDasharray={`${(focusCount / 3) * 100}, 100`} strokeWidth="3.5" strokeLinecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                                    </svg>
                                    <span className="text-xs font-bold tracking-tight text-slate-200">{focusCount}/3</span>
                                </div>

                                <button
                                    onClick={() => { setIsQuickFocus(false); setIsAddOpen(true); }}
                                    className="hidden md:flex items-center space-x-1.5 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-lg shadow-indigo-600/20 transition active:scale-95"
                                >
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 4v16m8-8H4"/></svg>
                                    <span>Add Task</span>
                                </button>
                            </div>
                        </header>

                        {/* Filter Bar */}
                        <div className="px-5 py-3 bg-[#0F1117] flex items-center justify-between border-b border-slate-800/40">
                            <div className="flex space-x-1 bg-slate-900/90 p-1 rounded-xl border border-slate-800">
                                {['all', 'work', 'personal'].map((cat) => (
                                    <button
                                        key={cat}
                                        onClick={() => setFilter(cat)}
                                        className={`px-4 py-1.5 rounded-lg text-xs font-bold capitalize transition ${
                                            filter === cat 
                                                ? 'bg-slate-800 text-white shadow-sm border border-slate-700/60' 
                                                : 'text-slate-400 hover:text-slate-200'
                                        }`}
                                    >
                                        {cat}
                                    </button>
                                ))}
                            </div>
                            
                            <div className="text-xs text-slate-400 font-medium">
                                {focusCount >= 3 ? (
                                    <span className="text-amber-400 font-semibold flex items-center space-x-1">
                                        <span className="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
                                        <span>Focus Locked (3/3)</span>
                                    </span>
                                ) : (
                                    <span className="text-indigo-400 font-semibold">{3 - focusCount} slots open</span>
                                )}
                            </div>
                        </div>

                        {/* Main App Content Grid */}
                        <main className="flex-1 px-5 py-4 pb-28 md:pb-8 grid grid-cols-1 md:grid-cols-2 gap-6">
                            
                            {/* Left Column: Focus Now */}
                            <div className="space-y-4">
                                <div className="flex items-center justify-between">
                                    <h2 className="text-xs font-extrabold uppercase tracking-widest text-indigo-400 flex items-center space-x-2">
                                        <span>Focus Now (Max 3)</span>
                                    </h2>
                                    <span className="text-xs text-slate-400 font-semibold">{focusCount}/3 active</span>
                                </div>

                                <div className="space-y-3">
                                    {[0, 1, 2].map((slotIndex) => {
                                        const task = focusTasks[slotIndex];
                                        const isDraggingThis = dragMetaRef.current && dragMetaRef.current.id === task?.id;
                                        const dragOffsetY = isDraggingThis ? dragMetaRef.current.offsetY : 0;

                                        if (!task) {
                                            return (
                                                <div key={`empty-${slotIndex}`} className="border-2 border-dashed border-slate-800/80 rounded-2xl p-4 flex items-center justify-center text-slate-400 text-xs font-semibold h-[74px] bg-slate-950/20">
                                                    Slot {slotIndex + 1} open
                                                </div>
                                            );
                                        }

                                        return (
                                            <div
                                                key={task.id}
                                                data-id={task.id}
                                                style={{
                                                    transform: `translate3d(0, ${dragOffsetY}px, 0)`,
                                                    zIndex: isDraggingThis ? 30 : 10,
                                                    transition: isDraggingThis ? 'none' : 'transform 0.15s ease'
                                                }}
                                                className={`relative bg-[#161922] border rounded-2xl p-3.5 flex items-center justify-between shadow-lg transition-colors group ${
                                                    task.category === 'work' ? 'border-indigo-500/30 hover:border-indigo-500/50' : 'border-teal-500/30 hover:border-teal-500/50'
                                                } ${isDraggingThis ? 'shadow-2xl ring-2 ring-indigo-500/60 opacity-95 bg-[#1b1f2e]' : ''}`}
                                            >
                                                <div className={`absolute left-0 top-3 bottom-3 w-1 rounded-r-full ${task.category === 'work' ? 'bg-indigo-500' : 'bg-teal-400'}`}></div>

                                                <div className="flex items-center space-x-3 pl-2.5 flex-1 min-w-0">
                                                    {/* Drag Handle */}
                                                    <div 
                                                        onPointerDown={(e) => handlePointerDown(e, task, 'focus')}
                                                        className="cursor-grab active:cursor-grabbing text-slate-400 hover:text-slate-200 p-2 touch-dragging select-none"
                                                        title="Drag to reorder"
                                                    >
                                                        <svg className="w-5 h-5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 8h16M4 16h16"/></svg>
                                                    </div>

                                                    <button
                                                        onClick={() => toggleComplete(task.id)}
                                                        className="w-6 h-6 rounded-lg border-2 border-slate-600 hover:border-indigo-400 flex items-center justify-center transition shrink-0"
                                                    >
                                                        <svg className="w-3.5 h-3.5 text-indigo-400 opacity-0 hover:opacity-100 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"/></svg>
                                                    </button>

                                                    <div className="flex-1 min-w-0">
                                                        {editingId === task.id ? (
                                                            <input
                                                                type="text"
                                                                autoFocus
                                                                value={editText}
                                                                onChange={(e) => setEditText(e.target.value)}
                                                                onBlur={() => saveInlineEdit(task.id)}
                                                                onKeyDown={(e) => { if (e.key === 'Enter') saveInlineEdit(task.id); if (e.key === 'Escape') setEditingId(null); }}
                                                                className="w-full bg-slate-900 border border-indigo-500/60 rounded-lg px-2.5 py-1 text-sm text-white focus:outline-none"
                                                            />
                                                        ) : (
                                                            <div 
                                                                onClick={() => { setEditingId(task.id); setEditText(task.title); }}
                                                                className="text-sm font-semibold text-slate-100 truncate cursor-pointer hover:text-indigo-300 transition"
                                                                title="Click to edit"
                                                            >
                                                                {task.title}
                                                            </div>
                                                        )}
                                                        <div className="flex items-center space-x-2 mt-0.5">
                                                            <span className={`text-[10px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded ${task.category === 'work' ? 'bg-indigo-500/10 text-indigo-400' : 'bg-teal-500/10 text-teal-400'}`}>
                                                                {task.category}
                                                            </span>
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="flex items-center space-x-1 shrink-0 ml-2">
                                                    <button
                                                        onClick={() => moveToWaiting(task.id)}
                                                        className="text-slate-400 hover:text-amber-400 p-1.5 rounded-lg hover:bg-slate-800 transition"
                                                        title="Park / Wait on external"
                                                    >
                                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                                    </button>
                                                    <button
                                                        onClick={() => moveToQueue(task.id)}
                                                        className="text-slate-400 hover:text-indigo-400 p-1.5 rounded-lg hover:bg-slate-800 transition"
                                                        title="Move to Up Next Queue"
                                                    >
                                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"/></svg>
                                                    </button>
                                                    <button
                                                        onClick={() => deleteTask(task.id)}
                                                        className="text-slate-400 hover:text-rose-400 p-1.5 rounded-lg hover:bg-slate-800 transition"
                                                        title="Delete task"
                                                    >
                                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2.002 2.002 0 0116.138 21H7.862a2.002 2.002 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Right Column: Up Next Queue & Waiting Shelf */}
                            <div className="space-y-6">
                                
                                <div className="space-y-4">
                                    <div className="flex items-center justify-between">
                                        <h2 className="text-xs font-extrabold uppercase tracking-widest text-slate-400">Up Next Queue</h2>
                                        <span className="text-xs text-slate-400 font-semibold">{queueTasks.length} items</span>
                                    </div>

                                    <div className="space-y-2.5 max-h-[320px] overflow-y-auto pr-1">
                                        {queueTasks.length === 0 ? (
                                            <div className="text-center py-6 border border-dashed border-slate-800 rounded-2xl text-slate-400 text-xs">
                                                No tasks in backlog queue
                                            </div>
                                        ) : (
                                            queueTasks.map((task) => {
                                                const isDraggingThis = dragMetaRef.current && dragMetaRef.current.id === task.id;
                                                const dragOffsetY = isDraggingThis ? dragMetaRef.current.offsetY : 0;

                                                return (
                                                    <div
                                                        key={task.id}
                                                        data-id={task.id}
                                                        style={{
                                                            transform: `translate3d(0, ${dragOffsetY}px, 0)`,
                                                            zIndex: isDraggingThis ? 30 : 10,
                                                            transition: isDraggingThis ? 'none' : 'transform 0.15s ease'
                                                        }}
                                                        className={`bg-[#161922] border border-slate-800/80 rounded-2xl p-3 flex items-center justify-between shadow transition ${isDraggingThis ? 'shadow-2xl ring-2 ring-indigo-500/60 opacity-95 bg-[#1b1f2e]' : ''}`}
                                                    >
                                                        <div className="flex items-center space-x-3 flex-1 min-w-0 pl-1">
                                                            <div 
                                                                onPointerDown={(e) => handlePointerDown(e, task, 'queue')}
                                                                className="cursor-grab active:cursor-grabbing text-slate-400 hover:text-slate-200 p-2 touch-dragging select-none"
                                                                title="Drag to reorder"
                                                            >
                                                                <svg className="w-5 h-5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 8h16M4 16h16"/></svg>
                                                            </div>

                                                            <div className="flex-1 min-w-0">
                                                                {editingId === task.id ? (
                                                                    <input
                                                                        type="text"
                                                                        autoFocus
                                                                        value={editText}
                                                                        onChange={(e) => setEditText(e.target.value)}
                                                                        onBlur={() => saveInlineEdit(task.id)}
                                                                        onKeyDown={(e) => { if (e.key === 'Enter') saveInlineEdit(task.id); if (e.key === 'Escape') setEditingId(null); }}
                                                                        className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-sm text-white focus:outline-none"
                                                                    />
                                                                ) : (
                                                                    <div 
                                                                        onClick={() => { setEditingId(task.id); setEditText(task.title); }}
                                                                        className="text-sm font-medium text-slate-200 truncate cursor-pointer hover:text-indigo-300 transition"
                                                                        title="Click to edit"
                                                                    >
                                                                        {task.title}
                                                                    </div>
                                                                )}
                                                                <span className={`text-[10px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded ${task.category === 'work' ? 'bg-indigo-500/10 text-indigo-400' : 'bg-teal-500/10 text-teal-400'}`}>
                                                                    {task.category}
                                                                </span>
                                                            </div>
                                                        </div>

                                                        <div className="flex items-center space-x-1 shrink-0 ml-2">
                                                            {focusCount < 3 ? (
                                                                <button
                                                                    onClick={() => moveToFocus(task.id)}
                                                                    className="bg-indigo-500/10 text-indigo-400 hover:bg-indigo-500/20 px-2.5 py-1 rounded-lg text-xs font-bold transition"
                                                                >
                                                                    Focus →
                                                                </button>
                                                            ) : (
                                                                <span className="text-[10px] bg-slate-800 text-slate-400 px-2 py-1 rounded-lg font-semibold">Full</span>
                                                            )}
                                                            <button
                                                                onClick={() => deleteTask(task.id)}
                                                                className="text-slate-400 hover:text-rose-400 p-1.5 rounded-lg hover:bg-slate-800 transition"
                                                            >
                                                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2.002 2.002 0 0116.138 21H7.862a2.002 2.002 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                                            </button>
                                                        </div>
                                                    </div>
                                                );
                                            })
                                        )}
                                    </div>
                                </div>

                                {waitingTasks.length > 0 && (
                                    <div className="space-y-3">
                                        <div className="flex items-center justify-between">
                                            <h2 className="text-xs font-extrabold uppercase tracking-widest text-amber-400 flex items-center space-x-1.5">
                                                <span>Waiting On / Parked</span>
                                            </h2>
                                            <span className="text-xs text-slate-400 font-semibold">{waitingTasks.length} parked</span>
                                        </div>
                                        <div className="space-y-2">
                                            {waitingTasks.map(task => (
                                                <div key={task.id} className="bg-[#161922] border border-amber-500/20 rounded-2xl p-3 flex items-center justify-between">
                                                    <div className="flex-1 min-w-0 pr-2">
                                                        <div className="text-sm font-medium text-slate-300 truncate">{task.title}</div>
                                                        <span className="text-[10px] text-amber-400 font-bold uppercase tracking-wider">Blocked / Waiting</span>
                                                    </div>
                                                    <div className="flex items-center space-x-1">
                                                        {focusCount < 3 && (
                                                            <button
                                                                onClick={() => moveToFocus(task.id)}
                                                                className="bg-indigo-500/10 text-indigo-400 hover:bg-indigo-500/20 px-2.5 py-1 rounded-lg text-xs font-bold transition"
                                                            >
                                                                Resume
                                                            </button>
                                                        )}
                                                        <button
                                                            onClick={() => moveToQueue(task.id)}
                                                            className="text-slate-400 hover:text-slate-200 p-1.5 rounded-lg hover:bg-slate-800 transition text-xs font-medium"
                                                        >
                                                            To Queue
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div>
                                    <button
                                        onClick={() => setIsCompletedOpen(!isCompletedOpen)}
                                        className="w-full py-3 px-4 bg-[#161922] border border-slate-800/80 rounded-2xl flex items-center justify-between text-xs font-bold text-slate-300 hover:bg-slate-800/50 transition"
                                    >
                                        <span className="flex items-center space-x-2">
                                            <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                                            <span>Completed Momentum ({completedTasks.length})</span>
                                        </span>
                                        <svg className={`w-4 h-4 transform transition-transform ${isCompletedOpen ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"/></svg>
                                    </button>

                                    {isCompletedOpen && (
                                        <div className="mt-2 space-y-2 max-h-60 overflow-y-auto pr-1">
                                            {completedTasks.length === 0 ? (
                                                <div className="text-center py-4 text-slate-400 text-xs">No completed tasks yet today.</div>
                                            ) : (
                                                completedTasks.map(task => (
                                                    <div key={task.id} className="bg-slate-900/60 border border-slate-800/60 rounded-xl p-2.5 flex items-center justify-between text-xs">
                                                        <span className="line-through text-slate-400 truncate flex-1 pr-2">{task.title}</span>
                                                        <button
                                                            onClick={() => toggleComplete(task.id)}
                                                            className="text-indigo-400 hover:underline font-semibold shrink-0"
                                                        >
                                                            Restore
                                                        </button>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    )}
                                </div>

                            </div>
                        </main>

                        {/* Mobile Floating Bottom Dock */}
                        <div className="md:hidden fixed bottom-0 left-0 right-0 p-4 bg-[#0F1117]/90 backdrop-blur-xl border-t border-slate-800 flex items-center justify-between z-30">
                            <button
                                onClick={() => { setIsQuickFocus(false); setIsAddOpen(true); }}
                                className="w-full py-3.5 bg-indigo-600 active:bg-indigo-500 text-white rounded-2xl font-bold text-sm shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2"
                            >
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 4v16m8-8H4"/></svg>
                                <span>Add New Task</span>
                            </button>
                        </div>

                        {/* Add Task Modal */}
                        {isAddOpen && (
                            <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center bg-black/70 backdrop-blur-sm p-0 md:p-4">
                                <div className="w-full md:max-w-md bg-[#161922] border border-slate-800 rounded-t-3xl md:rounded-3xl p-6 shadow-2xl animate-in fade-in slide-in-from-bottom duration-200">
                                    <div className="w-12 h-1 bg-slate-700 rounded-full mx-auto mb-5 md:hidden"></div>
                                    <div className="flex items-center justify-between mb-4">
                                        <h3 className="text-lg font-extrabold text-white">Create New Task</h3>
                                        <button onClick={() => setIsAddOpen(false)} className="text-slate-400 hover:text-white p-1">
                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>
                                        </button>
                                    </div>

                                    <form onSubmit={addTask} className="space-y-4">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Task Title</label>
                                            <input
                                                type="text"
                                                autoFocus
                                                value={newTitle}
                                                onChange={(e) => setNewTitle(e.target.value)}
                                                placeholder="e.g. Review CI/CD pipeline logs..."
                                                className="w-full bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Context Category</label>
                                            <div className="grid grid-cols-2 gap-3">
                                                <button
                                                    type="button"
                                                    onClick={() => setNewCategory('work')}
                                                    className={`py-2.5 rounded-xl text-xs font-bold border transition ${newCategory === 'work' ? 'bg-indigo-600 text-white border-indigo-500 shadow-md shadow-indigo-600/20' : 'bg-slate-900 text-slate-300 border-slate-800'}`}
                                                >
                                                    Work
                                                </button>
                                                <button
                                                    type="button"
                                                    onClick={() => setNewCategory('personal')}
                                                    className={`py-2.5 rounded-xl text-xs font-bold border transition ${newCategory === 'personal' ? 'bg-teal-600 text-white border-teal-500 shadow-md shadow-teal-600/20' : 'bg-slate-900 text-slate-300 border-slate-800'}`}
                                                >
                                                    Personal
                                                </button>
                                            </div>
                                        </div>

                                        <div className="pt-2">
                                            <button
                                                type="submit"
                                                className="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl font-bold text-sm shadow-lg shadow-indigo-600/20 transition active:scale-98"
                                            >
                                                Save Task
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* GitHub Gist Cloud Sync Modal */}
                        {isSyncModalOpen && (
                            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
                                <div className="w-full max-w-md bg-[#161922] border border-slate-800 rounded-3xl p-6 shadow-2xl">
                                    <div className="flex items-center justify-between mb-4">
                                        <h3 className="text-lg font-extrabold text-white flex items-center space-x-2">
                                            <span>GitHub Gist Sync</span>
                                        </h3>
                                        <button onClick={() => setIsSyncModalOpen(false)} className="text-slate-400 hover:text-white p-1">
                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>
                                        </button>
                                    </div>

                                    <p className="text-xs text-slate-400 mb-4 leading-relaxed">
                                        Sync tasks seamlessly across your computer and phone using a Private GitHub Gist. Your credentials are saved securely in your browser.
                                    </p>

                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">GitHub Personal Access Token</label>
                                            <input
                                                type="password"
                                                value={gistToken}
                                                onChange={(e) => setGistToken(e.target.value)}
                                                placeholder="ghp_..."
                                                className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 font-mono"
                                            />
                                        </div>

                                        <div>
                                            <label className="log block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Secret Gist ID</label>
                                            <input
                                                type="text"
                                                value={gistId}
                                                onChange={(e) => setGistId(e.target.value)}
                                                placeholder="e.g. a1b2c3d4e5f6..."
                                                className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 font-mono"
                                            />
                                        </div>

                                        <div className="pt-2 flex space-x-3">
                                            <button
                                                onClick={() => handleManualSync(false)}
                                                disabled={isSyncing}
                                                className="flex-1 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold text-xs shadow-md shadow-indigo-600/20 transition disabled:opacity-50"
                                            >
                                                {isSyncing ? 'Syncing...' : 'Sync & Save'}
                                            </button>
                                            <button
                                                onClick={() => handleManualSync(true)}
                                                disabled={isSyncing}
                                                className="px-4 py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl font-bold text-xs transition"
                                            >
                                                Push Local
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
